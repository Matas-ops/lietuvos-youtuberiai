<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Lietuvos Youtuberiai</title>

    <script src="/theme.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">

    <link href="/site.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">

<header class="app-header">
    <div class="container py-3 d-flex align-items-center gap-3">
        <span class="brand-mark" aria-hidden="true"></span>

        <h1 class="h4 mb-0 me-auto text-truncate min-w-0">Lietuvos Youtuberiai</h1>

        <span id="summary" class="text-body-secondary small d-none d-sm-inline"></span>

        <a href="/admin/" class="btn btn-outline-secondary btn-sm rounded-pill d-inline-flex align-items-center gap-1 flex-shrink-0"
           title="Administratoriaus prisijungimas" aria-label="Administratoriaus prisijungimas">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                <path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2m3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2"/>
            </svg>
            <span class="d-none d-sm-inline">Administravimas</span>
        </a>

        <button id="themeToggle" type="button"
                class="btn btn-outline-secondary rounded-circle theme-toggle"
                title="Perjungti temą" aria-label="Perjungti temą">
            <svg class="icon-moon" width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                <path d="M6 .278a.77.77 0 0 1 .08.858 7.2 7.2 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277q.792-.001 1.533-.16a.79.79 0 0 1 .81.316.73.73 0 0 1-.031.893A8.35 8.35 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.75.75 0 0 1 6 .278"/>
            </svg>
            <svg class="icon-sun" width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                <path d="M8 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8M8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0m0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13m8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5M3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8m10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0m-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0m9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707M4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .708"/>
            </svg>
        </button>
    </div>

    <div id="progress"></div>
</header>

<main class="container py-4">

    <div class="search-wrap mb-3">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
        </svg>
        <input id="search" type="search" class="form-control form-control-lg rounded-pill"
               placeholder="Ieškoti kanalų pagal pavadinimą..." autocomplete="off">
    </div>

    <div class="d-flex align-items-center justify-content-between mb-2">
        <span class="text-body-secondary small fw-semibold text-uppercase">Kategorijos</span>
        <button id="clearFilters" type="button" class="btn btn-link btn-sm p-0 d-none">Išvalyti filtrus</button>
    </div>

    <div id="tags" class="tag-filter mb-4"></div>

    <div id="resultInfo" class="text-body-secondary small mb-3"></div>

    <div id="channels" class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-3"></div>

    <div id="empty" class="text-center text-body-secondary py-5 d-none"></div>

</main>

<script src="/app.js"></script>

</body>
</html>
